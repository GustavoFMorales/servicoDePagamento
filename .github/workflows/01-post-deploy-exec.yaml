# CI de nível de deploy, para executar comandos pós-deploy

# nome pepiline

name: "Execução via push"

on:
  push:
    branches:
     - main

jobs:
  tests-unitarios:
    runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v4 # para fazer checkout do código
  
     - uses: actions/setup-node@v4
       with:
          node-version: '18' # versão do Node.js que você deseja usar 
     - name: Notificar início do processo via Discord
       env:
          WEBHOOK: ${{secrets.DISCORD_WEBHOOK_URL}}
       run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"Início do processo de testes unitários\"}" \
               $WEBHOOK

     - name: Instalando dependências
       run: npm install
      
     - name: Executando testes unitários
       run: npm run test
     - name: Notificar sucesso no Discord
       if: success()
       uses: sarisia/actions-status-discord@v1
       with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'success'
          title: 'Pipeline Concluída com Sucesso'
          description: 'Todos os testes e2e passaram.'
          color: 0x28A745

      # notificação de falha no Discord (só executa se algo falhou)
     - name: Notificar falha no Discord
       if: failure()
       uses: sarisia/actions-status-discord@v1
       with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'failure'
          title: 'Pipeline Falhou'
          description: 'Um ou mais testes e2e falharam.'
          color: 0xDC3545
      